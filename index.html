<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ishaq RepVision - Smooth Recording</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&family=Fraunces:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0A0B;--card:#18181B;--border:#27272A;--text:#FAFAFA;--muted:#71717A;--accent:#7C3AED;--red:#EF4444}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif}
.topnav{max-width:1200px;margin:auto;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;background:rgba(10,10,11,.95);border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:12px;font-family:'Fraunces',serif;font-size:22px;font-weight:800}
.logo-icon{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#7C3AED,#A78BFA);display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(124,58,237,.4)}
.logo span{color:#A78BFA}
.badge{font-size:10px;padding:6px 12px;border-radius:100px;border:1px solid var(--border);color:var(--muted)}
.app-shell{max-width:1200px;margin:auto;padding:20px;display:grid;grid-template-columns:360px 1fr;gap:16px}
@media(max-width:900px){.app-shell{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:16px}
.card h3{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);background:#0E0E10;color:#fff;font-weight:600}
.btn{width:100%;padding:13px;border-radius:12px;border:none;font-weight:700;cursor:pointer;margin-top:8px;display:flex;justify-content:center}
.btn-primary{background:#fff;color:#000}
.btn-rec{background:var(--red);color:#fff}
.btn-ghost{background:transparent;border:1px solid var(--border);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{text-align:center;padding:12px;background:#0E0E10;border:1px solid var(--border);border-radius:14px}
.stat span{font-family:'Fraunces',serif;font-size:28px;display:block}
.stat label{font-size:9px;color:var(--muted);letter-spacing:1px}
.video-wrap{position:relative;background:#000;border-radius:18px;overflow:hidden;aspect-ratio:4/3;border:1px solid var(--border)}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
video{transform:scaleX(-1)}
canvas{z-index:2}
.overlay{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;justify-content:space-between;padding:10px;pointer-events:none}
.topbar{display:flex;justify-content:space-between}
.pill{background:rgba(0,0,0,.7);color:#fff;padding:5px 10px;border-radius:100px;font-size:10px}
.pill.live{opacity:0}.pill.live.on{opacity:1;background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.hint{background:rgba(255,255,255,.9);color:#000;padding:8px 12px;border-radius:10px;font-size:11px;text-align:center;align-self:center}
.gallery{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.clip{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:6px}
.clip video{position:static;transform:none;width:100%;border-radius:8px;aspect-ratio:4/3}
.clip a{color:#A78BFA;font-size:11px;font-weight:700;text-decoration:none}
footer{text-align:center;color:var(--muted);font-size:11px;padding:16px}
</style>
</head>
<body>
<div class="topnav">
<div class="logo"><div class="logo-icon"><svg width="26" height="26" viewBox="0 0 100 100" fill="none"><circle cx="50" cy="22" r="11" stroke="white" stroke-width="5" fill="white" fill-opacity="0.2"/><path d="M35 35 L28 55 L45 60 L50 45 L60 50 L75 48 L72 62 L58 65 L50 85 L38 85 L40 65 L25 60 L22 45 Z" stroke="white" stroke-width="4" fill="none" stroke-linejoin="round"/><circle cx="20" cy="48" r="6" fill="white"/><circle cx="80" cy="48" r="6" fill="white"/><circle cx="38" cy="88" r="5" fill="white"/><circle cx="52" cy="88" r="5" fill="white"/></svg></div>ISHAQ <span>REP VISION</span></div>
<div class="badge">SMOOTH REC • BY ISHAQ</div>
</div>
<div class="app-shell">
<div>
<div class="card">
<h3>Ishaq Workout</h3>
<select id="exercise"><option value="squat">Squats</option><option value="pushup">Push-ups</option><option value="jumpingjack">Jumping Jacks</option><option value="curl">Bicep Curls</option><option value="lunge">Lunges</option></select>
<button id="startBtn" class="btn btn-primary">Start Camera</button>
<button id="recordBtn" class="btn btn-rec">● Record Smooth</button>
<button id="resetBtn" class="btn btn-ghost">Reset</button>
<div class="stats"><div class="stat"><span id="reps">0</span><label>REPS</label></div><div class="stat"><span id="timer">00:00</span><label>TIME</label></div><div class="stat"><span id="stage">Ready</span><label>STATUS</label></div></div>
<div style="font-size:10px;color:#71717A;text-align:center;margin-top:8px">💡 Tip: Use Chrome on phone for smoothest video</div>
</div>
</div>
<div>
<div class="video-wrap"><video id="video" autoplay playsinline muted></video><canvas id="canvas"></canvas><div class="overlay"><div class="topbar"><div class="pill" id="modelBadge">LOADING ISHAQ AI...</div><div class="pill live" id="liveBadge">● REC</div></div><div class="hint" id="hint">Loading...</div></div></div>
<div class="gallery" id="gallery"></div>
</div>
</div>
<footer>Built by <b>Ishaq</b> — Ishaq RepVision Smooth © 2026</footer>
<script type="importmap">{"imports":{"@mediapipe/tasks-vision":"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"}}</script>
<script type="module">
import {PoseLandmarker,FilesetResolver,DrawingUtils} from "@mediapipe/tasks-vision";
const video=document.getElementById('video'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d',{alpha:false});
const repsEl=document.getElementById('reps'),timerEl=document.getElementById('timer'),stageEl=document.getElementById('stage');
const exSel=document.getElementById('exercise'),startBtn=document.getElementById('startBtn'),recordBtn=document.getElementById('recordBtn'),resetBtn=document.getElementById('resetBtn');
const hint=document.getElementById('hint'),liveBadge=document.getElementById('liveBadge'),modelBadge=document.getElementById('modelBadge'),gallery=document.getElementById('gallery');
const W=640,H=480,INFER_MS=66; // AI runs ~15x/sec, drawing + recording run at full camera rate
let poseLandmarker,running=false,reps=0,state='up',seconds=0,timerInt=null,drawingUtils,mediaRecorder=null,chunks=[],recording=false;
let lastLm=null,lastInfer=0,lastStage='',recMime='video/webm',audioCtx=null;

function angle(a,b,c){const ab={x:a.x-b.x,y:a.y-b.y},cb={x:c.x-b.x,y:c.y-b.y};return Math.acos(Math.min(1,Math.max(-1,(ab.x*cb.x+ab.y*cb.y)/(Math.hypot(ab.x,ab.y)*Math.hypot(cb.x,cb.y)))))*180/Math.PI;}
function setStage(t){if(t!==lastStage){lastStage=t;stageEl.textContent=t;}}

async function init(){
 const fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
 poseLandmarker=await PoseLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",delegate:"GPU"},runningMode:"VIDEO",numPoses:1});
 canvas.width=W;canvas.height=H;
 drawingUtils=new DrawingUtils(ctx);
 modelBadge.textContent="ISHAQ AI • SMOOTH READY";
 hint.textContent="Ishaq RepVision Smooth ready. Start camera.";
}
await init();

startBtn.onclick=async()=>{
 if(!running){
  const vid={width:{ideal:W},height:{ideal:H},frameRate:{ideal:30},facingMode:"user"};
  let s;
  try{s=await navigator.mediaDevices.getUserMedia({video:vid,audio:{echoCancellation:true,noiseSuppression:true}});}
  catch{s=await navigator.mediaDevices.getUserMedia({video:vid,audio:false});}
  video.srcObject=s;await video.play();
  running=true;startBtn.textContent="Stop Camera";
  timerInt=setInterval(()=>{seconds++;timerEl.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+":"+String(seconds%60).padStart(2,'0');},1000);
  schedule();
 }else{
  running=false;startBtn.textContent="Start Camera";clearInterval(timerInt);
  if(recording)stopRec();if(video.srcObject)video.srcObject.getTracks().forEach(t=>t.stop());
  lastLm=null;
 }
};

recordBtn.onclick=()=>{if(!running){hint.textContent="Start camera first!";return;}if(!recording)startRec();else stopRec();};

// vp8 is much lighter to encode in real time than vp9 (vp9 was the main cause of lag)
function getMime(){
 const list=['video/webm;codecs=vp8,opus','video/webm;codecs=vp8','video/webm','video/mp4'];
 for(const m of list){if(MediaRecorder.isTypeSupported(m))return m;}
 return '';
}

function startRec(){
 recMime=getMime();
 const stream=canvas.captureStream(30);
 const audio=video.srcObject.getAudioTracks()[0];
 const finalStream=new MediaStream([...stream.getVideoTracks(),...(audio?[audio]:[])]);
 chunks=[];
 const opts={videoBitsPerSecond:2500000,audioBitsPerSecond:96000};
 if(recMime)opts.mimeType=recMime;
 try{mediaRecorder=new MediaRecorder(finalStream,opts);}
 catch{mediaRecorder=new MediaRecorder(finalStream);}
 const type=mediaRecorder.mimeType||recMime||'video/webm';
 const ext=type.includes('mp4')?'mp4':'webm';
 mediaRecorder.ondataavailable=e=>{if(e.data&&e.data.size>0)chunks.push(e.data);};
 mediaRecorder.onstop=()=>{
  const blob=new Blob(chunks,{type});
  const url=URL.createObjectURL(blob);
  const d=document.createElement('div');d.className='clip';
  d.innerHTML=`<video src="${url}" controls playsinline></video><div style="font-size:10px;color:#71717A;margin:4px 0">${exSel.value} • ${reps} reps • ${timerEl.textContent}</div><a href="${url}" download="ishaq-${Date.now()}.${ext}">⬇ Download Smooth Video</a>`;
  gallery.prepend(d);
  chunks=[];
  hint.textContent="Saved! Smooth video ready below.";
 };
 mediaRecorder.start(1000); // larger timeslice = far less overhead than 100ms
 recording=true;recordBtn.textContent="■ Stop & Save";liveBadge.classList.add('on');
 hint.textContent="Recording smooth 30fps...";
}

function stopRec(){if(mediaRecorder&&recording&&mediaRecorder.state!=='inactive')mediaRecorder.stop();recording=false;recordBtn.textContent="● Record Smooth";liveBadge.classList.remove('on');}
resetBtn.onclick=()=>{reps=0;seconds=0;state='up';repsEl.textContent='0';timerEl.textContent='00:00';setStage('Ready');};

function beep(){
 try{
  if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.frequency.value=880;g.gain.value=0.15;o.connect(g);g.connect(audioCtx.destination);
  o.start();o.stop(audioCtx.currentTime+0.1);
 }catch{}
}

function countRep(){reps++;repsEl.textContent=reps;beep();}

function runRepLogic(lm){
 const ex=exSel.value;
 if(ex==='squat'||ex==='lunge'){const avg=(angle(lm[23],lm[25],lm[27])+angle(lm[24],lm[26],lm[28]))/2;setStage(avg>160?"UP":avg<90?"DOWN":"GO");if(avg>160&&state==='down'){state='up';countRep();}if(avg<90&&state==='up')state='down';}
 else if(ex==='pushup'){const avg=(angle(lm[11],lm[13],lm[15])+angle(lm[12],lm[14],lm[16]))/2;if(avg>160&&state==='down'){state='up';countRep();}if(avg<80&&state==='up')state='down';}
 else if(ex==='jumpingjack'){const up=lm[15].y<lm[11].y&&lm[16].y<lm[12].y;if(up&&state==='down'){state='up';countRep();}if(!up&&state==='up'&&lm[15].y>lm[23].y)state='down';}
 else{const avg=angle(lm[12],lm[14],lm[16]);if(avg>160&&state==='up'){state='down';countRep();}if(avg<50&&state==='down')state='up';}
}

// Draw loop is synced to real camera frames; AI is throttled and never blocks every frame
function schedule(){
 if(video.requestVideoFrameCallback)video.requestVideoFrameCallback(frame);
 else requestAnimationFrame(frame);
}

function frame(){
 if(!running)return;
 const now=performance.now();
 if(now-lastInfer>=INFER_MS){
  lastInfer=now;
  try{
   const r=poseLandmarker.detectForVideo(video,now);
   lastLm=(r.landmarks&&r.landmarks[0])||null;
   if(lastLm)runRepLogic(lastLm);
  }catch{}
 }
 // mirrored selfie view drawn straight into the canvas, so what you see is exactly what gets recorded
 ctx.save();ctx.translate(W,0);ctx.scale(-1,1);
 ctx.drawImage(video,0,0,W,H);
 if(lastLm){
  drawingUtils.drawLandmarks(lastLm,{radius:2,color:"#A78BFA"});
  drawingUtils.drawConnectors(lastLm,PoseLandmarker.POSE_CONNECTIONS,{color:"#ffffff55",lineWidth:2});
 }
 ctx.restore();
 ctx.font="bold 20px Outfit, sans-serif";ctx.fillStyle="white";ctx.shadowColor="rgba(0,0,0,.7)"
